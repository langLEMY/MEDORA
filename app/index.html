<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MEDORA</title>
    <script>
      // Tema antes del primer pintado (mismo criterio que lib/tema.ts): sin destello claro/oscuro.
      try {
        var t = localStorage.getItem("medora.tema") || "sistema";
        var oscuro = t === "oscuro" || (t === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.tema = oscuro ? "oscuro" : "claro";
      } catch (e) {}
    </script>
    <style>
      /* Logo estático mientras carga la app; React lo reemplaza por el Splash animado. */
      html, body, #root { height: 100%; margin: 0; }
      body { background: #e9ecf0; }
      html[data-tema="oscuro"] body { background: #0b0d12; }
      .arranque { display: grid; height: 100%; place-items: center; }
      .arranque svg { width: 80px; height: 80px; opacity: 0; animation: arranque-aparece 240ms ease-out 80ms forwards; }
      @keyframes arranque-aparece { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="arranque" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <defs>
            <linearGradient id="arranque-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#14B8A6" />
              <stop offset="1" stop-color="#0E7490" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="16" fill="url(#arranque-g)" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
