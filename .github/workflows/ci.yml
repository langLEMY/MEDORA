name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Escanear dependencias vulnerables
        run: npm audit --audit-level=high
      - name: Tipos
        run: npx tsc -b
      - name: Tests
        run: npm test -- --passWithNoTests
      - name: Build
        run: npx vite build

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore MEDORA.sln
      - name: Escanear paquetes NuGet vulnerables
        shell: bash
        run: |
          salida=$(dotnet list MEDORA.sln package --vulnerable --include-transitive 2>&1)
          echo "$salida"
          if echo "$salida" | grep -qE "Critical|High"; then
            echo "::error::Paquetes NuGet vulnerables de severidad Alta o Crítica."
            exit 1
          fi
      - run: dotnet build MEDORA.sln -c Release --no-restore
      - run: dotnet test MEDORA.sln -c Release --no-build

  # La base desde cero: aplica las 90+ migraciones en orden sobre un Supabase local,
  # carga la semilla (configuración de «FUNBIDE · Pruebas», sin personas) y corre las
  # baterías de roles y aislamiento. Si una migración ya no aplica limpia, falla aquí
  # y no en producción.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Supabase local (migraciones + semilla)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Baterías SQL (roles y aislamiento)
        run: |
          supabase db query --local --output-format json -f supabase/tests/funcional_roles.sql > funcional.json
          supabase db query --local --output-format json -f supabase/tests/rls_aislamiento.sql > rls.json
          python3 scripts/verificar-baterias.py funcional.json rls.json
      - name: Lint de funciones (avisa, no bloquea todavía)
        continue-on-error: true
        run: supabase db lint --local --level error

  # Punta a punta (Playwright). Sin secretos solo prueba la pantalla de acceso; con
  # E2E_USUARIO / E2E_CLAVE (cuenta que SOLO pertenezca a un sistema de pruebas) recorre la app.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        env:
          E2E_USUARIO: ${{ secrets.E2E_USUARIO }}
          E2E_CLAVE: ${{ secrets.E2E_CLAVE }}
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trazas
          path: app/test-results
          retention-days: 7
