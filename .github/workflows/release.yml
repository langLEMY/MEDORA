name: Release

# Publicar una versión:
#   1. Subir version.txt (p. ej. 1.4.0) y hacer commit en main.
#   2. git tag v1.4.0 && git push origin v1.4.0
# Este workflow publica, en la MISMA GitHub Release:
#   - Windows: instalador .exe + .exe.sha256 (launcher WebView2, con auto-update).
#   - Linux:   .AppImage y .deb (Tauri).
#   - macOS:   .dmg (Tauri, sin firmar).

# Destino: el código es privado; los instaladores se publican en un repo PÚBLICO de
# solo releases (variable de repositorio RELEASES_REPO = "medora-releases"), del que el
# launcher lee las actualizaciones. Hace falta el secreto RELEASES_TOKEN: token de grano
# fino con "Contents: read and write" SOLO sobre ese repo. Sin RELEASES_REPO publica en
# este mismo repositorio (así salió la versión puente 1.7.1).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  # --- Windows: instalador con el launcher (auto-update) ---
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que el tag coincide con version.txt
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "El tag ${{ github.ref_name }} no coincide con version.txt ($version)."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Tests del launcher
        run: dotnet test launcher/MEDORA.Actualizacion.Tests -c Release

      # Firma opcional (Azure Trusted Signing): sin estas variables y secretos sale sin firmar.
      - name: Generar instalador
        shell: pwsh
        env:
          FIRMA_ENDPOINT: ${{ vars.FIRMA_ENDPOINT }}
          FIRMA_CUENTA: ${{ vars.FIRMA_CUENTA }}
          FIRMA_PERFIL: ${{ vars.FIRMA_PERFIL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: ./scripts/generar-instalador.ps1

      - name: Verificar destino de la release
        shell: pwsh
        env:
          DESTINO: ${{ vars.RELEASES_REPO }}
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if ($env:DESTINO -and -not $env:TOKEN) {
            throw "RELEASES_REPO=$($env:DESTINO) pero falta el secreto RELEASES_TOKEN (token con Contents: write sobre ese repo)."
          }

      # Notas escritas a mano en notas-version/<tag>.md; si no hay, las genera GitHub
      # (solo al publicar en este repo: en el público no se exponen los commits).
      - name: Notas de la versión
        id: notas
        shell: pwsh
        run: |
          $ruta = "notas-version/${{ github.ref_name }}.md"
          if (Test-Path $ruta) { "ruta=$ruta" >> $env:GITHUB_OUTPUT; "auto=false" >> $env:GITHUB_OUTPUT }
          else { "ruta=" >> $env:GITHUB_OUTPUT; "auto=true" >> $env:GITHUB_OUTPUT }

      - name: Publicar release (crea la release con el .exe)
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository_owner }}/${{ vars.RELEASES_REPO || github.event.repository.name }}
          token: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          name: MEDORA ${{ github.ref_name }}
          body_path: ${{ steps.notas.outputs.ruta }}
          generate_release_notes: ${{ steps.notas.outputs.auto == 'true' && vars.RELEASES_REPO == '' }}
          files: |
            instalacion/Output/*.exe
            instalacion/Output/*.exe.sha256

  # --- Linux y macOS: apps de escritorio con Tauri ---
  escritorio:
    needs: instalador # la release ya existe; aquí solo se suben los binarios
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: ubuntu-22.04
            args: ''
          - plataforma: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - name: Inyectar la versión del tag en Tauri
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const f='desktop/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$v';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Caché de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Dependencias de Linux
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Compilar y subir (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ vars.RELEASES_REPO || github.event.repository.name }}
          projectPath: ./desktop
          tagName: ${{ github.ref_name }}
          releaseName: MEDORA ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # --- ¿Las PCs la van a ver? ---
  # El launcher busca actualizaciones en el repo de ServicioActualizacion.RepositorioPorDefecto
  # (leído del código, no de una variable). Si la release quedó en otro repo, o le falta el
  # .exe o su .sha256, el workflow falla aquí en vez de salir en verde sin que nadie se actualice.
  verificar-publicacion:
    needs: [instalador, escritorio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La release está donde el launcher la busca
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=$(grep -oP 'RepositorioPorDefecto = "\K[^"]+' launcher/MEDORA.Actualizacion/ServicioActualizacion.cs)
          echo "El launcher lee: $repo"
          for intento in 1 2 3 4 5; do
            json=$(curl -fsSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/releases/latest" || true)
            tag=$(echo "$json" | jq -r '.tag_name // empty')
            [ "$tag" = "$GITHUB_REF_NAME" ] && break
            sleep 20
          done
          if [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La última release de $repo es '${tag:-ninguna}', no $GITHUB_REF_NAME. Las PCs NO verán esta versión. Configura RELEASES_REPO + RELEASES_TOKEN o cópiala a mano (gh release create $GITHUB_REF_NAME -R $repo ...)."
            exit 1
          fi
          exe=$(echo "$json" | jq '[.assets[].name | select(endswith(".exe"))] | length')
          sha=$(echo "$json" | jq '[.assets[].name | select(endswith(".exe.sha256"))] | length')
          if [ "$exe" -lt 1 ] || [ "$sha" -lt 1 ]; then
            echo "::error::$repo/$GITHUB_REF_NAME no tiene el .exe y su .sha256: el launcher no ofrecerá la actualización."
            exit 1
          fi
          echo "OK: $repo/$GITHUB_REF_NAME con instalador y hash."
