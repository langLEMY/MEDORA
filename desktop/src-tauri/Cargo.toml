[package]
name = "medora"
version = "0.0.0"
description = "MEDORA — sistema de gestión hospitalaria"
authors = ["MEDORA"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "medora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
